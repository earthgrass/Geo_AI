# PI-ResConvLSTM Default Configuration
# ======================================
# Copy this file to create experiment-specific configs.

# Data
data:
  h5_path: "ConvLSTM_Dataset_128.h5"
  seq_len: 11
  precip_channel_idx: 0
  # Event-level / temporal split (no data leakage)
  train_years: [2014, 2022]
  val_years: [2023, 2023]
  test_years: [2024, 2024]
  num_workers: 4
  normalize: true
  precip_vmax: 100.0

# Model
model:
  name: "PI-ResConvLSTM"
  # Paper dataset schema: 12 channels. See src/config.py CHANNEL_NAMES for the
  # canonical channel order.
  #   0 precipitation | 1 center_wind_speed | 2 center_pressure | 3 distance_center
  #   4 dx | 5 dy | 6 u_move | 7 v_move | 8 dem | 9 dh_dx | 10 dh_dy | 11 land_mask
  input_channels: 12
  precip_channel_idx: 0
  hidden_dims: [64, 128]
  kernel_size: 3
  use_attention: false
  attention_reduction: 16
  dropout: 0.0
  use_layer_norm: false

# Training
training:
  batch_size: 8
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0001
  lr_patience: 10
  early_stopping_patience: 20
  grad_clip_norm: 1.0
  use_amp: true
  seed: 42

# Loss
# Base experiment = MSE ONLY. Extra terms are explicit opt-in:
#   base          -> components: ["rain"]
#   extreme       -> components: ["rain", "extreme"]
#   smooth        -> components: ["rain", "smooth"]
#   extreme_smooth-> components: ["rain", "extreme", "smooth"]
# Do NOT call "MSE + extreme + smooth" a physics-informed loss.
physics_loss:
  use_physics_loss: true
  lambda_smooth: 0.01
  lambda_extreme: 0.5
  lambda_oro: 0.1
  extreme_threshold: 10.0
  orographic_corr_weight: true
  # Orographic uplift constraint is OPT-IN and requires REAL environmental wind
  # channels. Storm translation velocities (u_move/v_move) are NOT valid wind
  # terms and must never be substituted here.
  orographic:
    enabled: false
    u_channel: null
    v_channel: null
    dh_dx_channel: 9
    dh_dy_channel: 10
  components: ["rain"]

# Output
output:
  checkpoint_dir: "outputs/models"
  log_dir: "outputs/logs"
