# PI-ResConvLSTM Default Configuration
# ======================================
# Copy this file to create experiment-specific configs.

# Data
data:
  h5_path: "ConvLSTM_Dataset_128.h5"
  seq_len: 11
  precip_channel_idx: 0
  train_years: [2014, 2022]
  val_years: [2023, 2023]
  test_years: [2024, 2024]
  num_workers: 4
  normalize: true
  precip_vmax: 100.0

# Model
model:
  name: "PI-ResConvLSTM"
  # The existing ConvLSTM_Dataset_128.h5 has 4 channels:
  # precipitation, wind field, pressure field, distance-to-center.
  # Set this to 16 only after rebuilding the expanded dataset.
  input_channels: 4
  precip_channel_idx: 0
  hidden_dims: [64, 128]
  kernel_size: 3
  use_attention: false
  attention_reduction: 16
  dropout: 0.0
  use_layer_norm: false

# Training
training:
  batch_size: 8
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0001
  lr_patience: 10
  early_stopping_patience: 20
  grad_clip_norm: 1.0
  use_amp: true
  seed: 42

# Physics Loss
physics_loss:
  use_physics_loss: true
  lambda_nonneg: 0.1
  lambda_oro: 0.1
  lambda_smooth: 0.01
  lambda_extreme: 0.5
  # Physical unit (mm/h). Trainer converts it automatically when precipitation
  # normalization is enabled.
  extreme_threshold: 10.0
  heavy_rain_alpha: 2.0
  orographic_corr_weight: true
  components: ["rain", "nonneg", "oro", "smooth", "extreme"]

# Output
output:
  checkpoint_dir: "outputs/models"
  log_dir: "outputs/logs"
