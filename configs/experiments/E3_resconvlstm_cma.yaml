# Experiment: ResConvLSTM + CMA storm state (E3) — Axis I alias: I3
# Channels (canonical indices): [0, 1, 2, 3, 4, 5, 6, 7]
# Loss components: rain
# Adds storm state / CMA geometry and translation vs I2.
data:
  h5_path: "ConvLSTM_Dataset_128.h5"
  seq_len: 11
  split_path: "configs/splits_v1.yaml"
  normalization_path: "configs/normalization_v1.json"
  precip_vmax: 100.0

model:
  name: "ResConvLSTM"
  input_channel_indices: [0, 1, 2, 3, 4, 5, 6, 7]
  hidden_dims: [64, 128]
  kernel_size: 3

training:
  batch_size: 4
  epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.0001
  lr_patience: 10
  early_stopping_patience: 10
  grad_clip_norm: 1.0
  seed: 42
  use_amp: auto
  checkpoint_selection_metric: rain_mse

physics_loss:
  enabled: true
  lambda_smooth: 0.01
  lambda_extreme: 0.5
  extreme_threshold: 10.0
  components: [rain]
  orographic:
    enabled: false

output:
  checkpoint_dir: "outputs/experiments/E3_resconvlstm_cma/models"
  log_dir: "outputs/experiments/E3_resconvlstm_cma/logs"
