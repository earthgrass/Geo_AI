# PI-ResConvLSTM Default Training Configuration
# =============================================
# Kept in sync with the canonical config at configs/default.yaml.
# Usage: python -m src.training.trainer --config path/to/config.yaml

# ---- Data ----
data:
  h5_path: "ConvLSTM_Dataset_128.h5"
  seq_len: 11
  precip_channel_idx: 0
  train_years: [2014, 2022]
  val_years: [2023, 2023]
  test_years: [2024, 2024]
  num_workers: 4
  normalize: true
  precip_vmax: 100.0

# ---- Model ----
model:
  name: "PI-ResConvLSTM"
  # Paper dataset schema: 12 channels (see src/config.py CHANNEL_NAMES).
  input_channels: 12
  precip_channel_idx: 0
  hidden_dims: [64, 128]
  kernel_size: 3
  use_attention: false
  attention_reduction: 16
  dropout: 0.0
  use_layer_norm: false

# ---- Training ----
training:
  batch_size: 8
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0001
  lr_patience: 10
  early_stopping_patience: 20
  grad_clip_norm: 1.0
  use_amp: true
  seed: 42

# ---- Loss (base = MSE only) ----
physics_loss:
  use_physics_loss: true
  lambda_smooth: 0.01
  lambda_extreme: 0.5
  lambda_oro: 0.1
  extreme_threshold: 10.0
  orographic_corr_weight: true
  orographic:
    enabled: false
    u_channel: null
    v_channel: null
    dh_dx_channel: 9
    dh_dy_channel: 10
  components: ["rain"]

# ---- Output ----
output:
  checkpoint_dir: "outputs/models"
  log_dir: "outputs/logs"
